<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Registro

</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<header>

<nav>

<h1>

UrbanWear

</h1>

</nav>

</header>

<section class="login-container">

<div class="login-card">

<h2>

Crear Cuenta

</h2>

<form id="form-registro">

<input
type="text"
id="nombre-registro"
placeholder="Nombre"
required>

<input
type="email"
id="correo-registro"
placeholder="Correo"
required>

<input
type="password"
id="password-registro"
placeholder="Contraseña"
required>

<button type="submit">

Registrarse

</button>

</form>

</div>

</section>

<script src="script.js"></script>

</body>

</html>
